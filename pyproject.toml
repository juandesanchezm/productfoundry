[project]
name = "productfoundry"
version = "0.1.0"
description = "Product-agnostic digital product engine"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "httpx>=0.27",
  "openai>=1.40",
  "pillow>=10.0",
  "img2pdf>=0.4",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
productfoundry = "productfoundry.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/productfoundry"]

[tool.hatch.build]
include = ["src/productfoundry/**", "runtime/**", "packs/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py312"
