id: tea-party
title_en: "Cocholate's Tea Party"
title_es: "La Merienda de Cocholate"
subtitle_en: "A Coloring Adventure"
subtitle_es: "Una aventura para colorear"
description_blurb_en: >
  Cocholate the baby dragon is hosting a tea party in the meadow. Set the table
  with cupcakes, brew tea in tiny teapots, and invite all the forest
  friends. 24 adorable pages of kawaii coloring fun.
description_blurb_es: >
  Cocholate el bebé dragón organiza una merienda en el prado. Pon la mesa
  con cupcakes, invita a todos los amigos del bosque y celebra la hora del
  té. 24 páginas adorables de pura diversión kawaii para colorear.
characters_present: [cocholate, pip, pebble, clover]
pages: 24
arc:
  - "waking up early in the nest, excited for the tea party, stretching tiny wings"
  - "writing tiny invitations with a leaf pen, a stack of folded leaf notes beside him"
  - "hopping out to the meadow to gather flowers for the table centerpiece"
  - "Pip helping to pick berries for the party, both carrying tiny baskets"
  - "setting up the table with a small flower-print tablecloth, tiny teacups arranged in a row"
  - "placing a tiny teapot on the table, steam rising from the spout"
  - "baking cupcakes in the meadow, mixing batter in a stone bowl, wearing a tiny chef hat"
  - "decorating cupcakes with frosting and tiny stars, frosting dripping softly"
  - "arranging cupcakes on a leaf platter, counting them on tiny fingers"
  - "watering the teapot with a tiny watering can, steam rising from the spout"
  - "inviting Pebble, holding a tiny flower as invitation, smiling"
  - "Pebble arriving with a tiny wrapped present, Cocholate waving hello"
  - "Pip arrives with a tiny berry basket, waving hello"
  - "Clover hops over a mushroom, carrying a present wrapped in a leaf"
  - "everybody sits at the table, tiny teacups raised, smiling"
  - "pouring tea from the tiny teapot, steam swirling up gently"
  - "sharing cupcakes around the table, each friend holding one"
  - "Pip reads a story from a tiny book, characters listen with wonder"
  - "playing a quiet game of hide-and-seek among the meadow flowers"
  - "Pebble drawing a spiral in the grass with a twig, friends watching"
  - "Clover hopping in a little circle of joy, Pip's wings fluttering"
  - "the friends sharing a final cupcake as the sun dips low"
  - "cleaning up together, stacking the tiny teacups neatly"
  - "saying goodbye at the nest, waving at friends as they leave, stars appearing"
