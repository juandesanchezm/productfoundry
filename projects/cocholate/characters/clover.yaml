name_en: Clover
name_es: Clover
archetype_en: "tiny green frog"
archetype_es: "ranita verde diminuta"
description_en: >
  Clover, a tiny green frog with big bulging eyes, a round belly, very long
  bent back legs, wide webbed feet, and a cheerful smile. Loves to hop and
  splash.
description_es: >
  Clover, una ranita verde diminuta con ojos grandes saltones, panza
  redonda, patas traseras muy largas y dobladas, pies palmeados anchos y
  sonrisa alegre. Le encanta saltar y chapotear.
