id: clover
role: supporting
name_en: Clover
name_es: Clover
archetype_en: "tiny kawaii green frog"
archetype_es: "ranita verde kawaii diminuta"
description_en: >
  Clover, a tiny kawaii green frog with big bulging eyes on top of the head,
  chubby round body, short stubby bent back legs, wide webbed feet, round
  belly, and a cheerful smile. Loves to hop and splash.
description_es: >
  Clover, una ranita verde kawaii diminuta con ojos grandes saltones encima
  de la cabeza, cuerpo rechoncho y redondo, patas traseras cortas y
  regordetas, pies palmeados anchos, panza redonda y sonrisa alegre. Le
  encanta saltar y chapotear.
