style:
  positive_prompt_suffix: "kawaii chibi style, black and white line art, children's coloring book page, cute adorable baby dragon character, oversized round head, big round expressive eyes, chubby round body, tiny wings, short stubby legs, soft belly, friendly smile, rounded tail tip, thick clean outlines, rounded soft shapes, minimal interior detail, balanced composition with about 5 percent comfortable margin on all sides, subject remains fully visible inside the safe area, simple flat white background, single page illustration, printable at 8.5x11 portrait"
  negative_prompt_suffix: "realistic, photorealistic, scary, detailed anatomy, thin lines, complex anatomy, multiple full-size figures, hands holding complex objects, manga, anime shading, gradient, color, 3d, blurry, watermark, text, signature, frame, border, cropped body, off-center, subject touching frame, perspective foreshortening, low detail background, sad or angry expressions, subject filling the entire frame, subject reaching the edges, horns, spikes, claws"
  character_consistency: "The main character Blaze must appear in every page with the exact same physical design: oversized round head, big round eyes, chubby round body, tiny wings, short stubby legs, soft belly, rounded tail tip. No horns, no spikes, no claws. Supporting characters (Pip, Pebble, Clover) keep their own fixed designs whenever they appear."
