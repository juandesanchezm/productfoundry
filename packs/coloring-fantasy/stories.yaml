characters:
  - id: blaze
    role: main
    name_en: Blaze
    name_es: Blaze
    archetype_en: "cute kawaii baby dragon"
    archetype_es: "bebé dragón kawaii tierno"
    description_en: >
      Blaze, a cute kawaii baby dragon with an oversized round head, big round
      expressive eyes, chubby round body, tiny wings, short stubby legs, soft
      belly, friendly smile, and a rounded tail tip. No horns, no spikes, no
      claws.
    description_es: >
      Blaze, un bebé dragón kawaii con cabeza redonda grande, ojos grandes y
      redondos, cuerpo rechoncho y redondo, alitas pequeñas, patitas cortas,
      barriguita suave, sonrisa amigable y punta de cola redondeada.
      Sin cuernos, sin púas, sin garras.
  - id: pip
    role: supporting
    name_en: Pip
    name_es: Pip
    archetype_en: "tiny yellow baby bird"
    archetype_es: "pajarito amarillo bebé"
    description_en: >
      Pip, a tiny round yellow baby bird with a big head, short stubby beak,
      fluffy downy body, tiny wings, and big round eyes. Often perched on
      Blaze's head or flying nearby.
    description_es: >
      Pip, un pajarito amarillo bebé redondo y diminuto con cabeza grande,
      pico corto y rechoncho, cuerpo de plumón suave, alitas pequeñas y ojos
      grandes y redondos. Suele posarse en la cabeza de Blaze o volar cerca.
  - id: pebble
    role: supporting
    name_en: Pebble
    name_es: Pebble
    archetype_en: "tiny pink snail"
    archetype_es: "caracol rosa diminuto"
    description_en: >
      Pebble, a tiny pink snail with a round spiral shell, curved antennae,
      a small happy face, and a soft squishy body. Moves slowly and smiles a lot.
    description_es: >
      Pebble, un caracol rosa diminuto con caparazón redondo en espiral,
      antenas curvadas, carita feliz y cuerpo suave y blandito. Se mueve
      despacio y sonríe mucho.
  - id: clover
    role: supporting
    name_en: Clover
    name_es: Clover
    archetype_en: "tiny green frog"
    archetype_es: "ranita verde diminuta"
    description_en: >
      Clover, a tiny green frog with big bulging eyes, a round belly, very long
      bent back legs, wide webbed feet, and a cheerful smile. Loves to hop and
      splash.
    description_es: >
      Clover, una ranita verde diminuta con ojos grandes saltones, panza
      redonda, patas traseras muy largas y dobladas, pies palmeados anchos y
      sonrisa alegre. Le encanta saltar y chapotear.

stories:
  - id: baby-dragon-first-day
    title_en: "A Baby Dragon's First Day"
    title_es: "El Primer Día del Bebé Dragón"
    subtitle_en: "A kawaii coloring adventure for kids 3-8"
    subtitle_es: "Una aventura kawaii para colorear, niños 3-8"
    description_blurb_en: "Meet Blaze, the cutest baby dragon in the Enchanted Forest. Today is his very first day exploring beyond the nest. Follow his morning discoveries, meadow games, new friendship with Pebble, waterfall adventure, sunset journey, and peaceful bedtime. 24 delightful pages of coloring fun."
    description_blurb_es: "Conoce a Blaze, el bebé dragón más tierno del Bosque Encantado. Hoy es su primer día explorando más allá del nido. Acompáñalo en sus descubrimientos matutinos, juegos en el prado, nueva amistad con Pebble, aventura en la cascada, paseo al atardecer y tranquila hora de dormir. 24 páginas adorables para colorear."
    characters_present: [blaze, pip, pebble]
    arc:
      - "waking up in the cozy nest, eyes half-open, yawning, soft morning light filtering through the leaves"
      - "stretching tiny wings and greeting the morning sun from the nest, leaves rustling overhead"
      - "sharing breakfast in the nest, drinking honeydew from a tiny cup, Pip perched on the nest edge chirping"
      - "Pip bringing a berry breakfast to Blaze, both friends smiling beside the nest's leafy doorway"
      - "stepping out of the nest onto a big mushroom, looking around with wonder at the meadow"
      - "following a trail of daisies through the meadow, Blaze carrying one fallen petal like a treasure"
      - "playing in the meadow with two butterflies, jumping with joy, surrounded by large flowers"
      - "rolling gently down a soft grassy hill and landing beside a patch of clover, laughing"
      - "meeting Pebble, a tiny pink snail sitting on a leaf, Blaze bending down to greet them"
      - "Pebble showing Blaze a spiral trail through the grass, with tiny flowers marking the path"
      - "crossing a shallow stream on round stepping stones, Pip flying above and Pebble riding on a leaf"
      - "discovering a little bridge of woven branches over the stream, Blaze peeking over the rail"
      - "splashing in a small waterfall, water droplets around, laughing with closed eyes"
      - "Blaze and Pebble resting beside the waterfall under broad fern leaves, with a rainbow in the mist"
      - "building a tiny pebble tower near the pool, Blaze placing the final stone while Pip watches"
      - "sharing a quiet picnic on a mossy bank, berries and leaves arranged in a simple circle"
      - "climbing a grassy hill at sunset, Blaze looking back at the nest far away"
      - "sitting on the hilltop, watching orange and pink clouds while the first fireflies glow"
      - "following a moonlit path home at dusk, Pip flying alongside and Pebble waving from a leaf"
      - "crossing the quiet stream beneath the rising moon, with reflections and reeds around the path"
      - "saying goodnight in a tiny flower bed beside the nest, Blaze tucking Pip under a leaf"
      - "sharing a final sleepy smile with Pip and Pebble among moonlit flowers beside the nest"
      - "settling into the cozy nest, leaves gathered like a soft blanket, fireflies glowing outside"
      - "sleeping peacefully in the nest, stars and moon visible through the trees, fireflies lighting the nest"
    pages: 24
  - id: dragons-tea-party
    title_en: "The Little Dragon's Tea Party"
    title_es: "La Merienda del Pequeño Dragón"
    subtitle_en: "A kawaii coloring adventure for kids 3-8"
    subtitle_es: "Una aventura kawaii para colorear, niños 3-8"
    description_blurb_en: "Blaze the baby dragon is hosting a tea party in the meadow. Set the table with cupcakes, brew tea in tiny teapots, and invite all the forest friends. 10 adorable pages of kawaii coloring fun."
    description_blurb_es: "Blaze el bebé dragón organiza una merienda en el prado. Pon la mesa con cupcakes, prepara té en pequeñas teteras e invita a todos los amigos del bosque. 10 páginas adorables de pura diversión kawaii para colorear."
    characters_present: [blaze, pip, pebble, clover]
    arc:
      - "setting up the table with a small flower-print tablecloth, tiny teacups arranged in a row"
      - "baking cupcakes in the meadow, mixing batter in a stone bowl, wearing a tiny chef hat"
      - "decorating cupcakes with berries and tiny stars, berry frosting dripping"
      - "watering the teapot with a tiny watering can, steam rising from the spout"
      - "inviting Pebble, holding a tiny flower as invitation, smiling"
      - "Pip arrives with a tiny berry basket, waving hello"
      - "Clover hops over a mushroom, carrying a present wrapped in a leaf"
      - "everybody sits at the table, tiny teacups raised, smiling"
      - "Pip reads a story from a tiny book, characters listen with wonder"
      - "cleaning up together, sharing a final cupcake, sunset in the background"
    pages: 10
  - id: dragon-explorers
    title_en: "Baby Dragon's Big Adventure"
    title_es: "La Gran Aventura del Bebé Dragón"
    subtitle_en: "A kawaii coloring adventure for kids 3-8"
    subtitle_es: "Una aventura kawaii para colorear, niños 3-8"
    description_blurb_en: "Blaze the baby dragon sets out to explore the world. From the dragon castle to the treasure cave, from the moonlit lake to the cloud kingdom. 10 adorable pages of kawaii coloring adventure."
    description_blurb_es: "Blaze el bebé dragón parte a explorar el mundo. Del castillo del dragón a la cueva del tesoro, del lago bajo la luna al reino de las nubes. 10 páginas adorables de aventura kawaii para colorear."
    characters_present: [blaze, pip, pebble, clover]
    arc:
      - "leaving the cozy nest at dawn, the enchanted forest in the background, tiny backpack ready"
      - "arriving at the dragon castle, tiny castle with round towers, waving at the gate"
      - "meeting Pebble at the castle gate, Pebble giving a tour, smiling"
      - "crossing a wooden bridge over a stream, fish jumping in the water below"
      - "exploring a treasure cave, surrounded by piles of glittering gems, eyes wide"
      - "riding a leaf boat through the moonlit lake, fireflies dancing above"
      - "climbing a fluffy cloud, soft pillows of clouds, smiling at a tiny bird"
      - "reaching the top of the cloud castle, waving at the stars, super happy"
      - "watching the sunrise from the top, golden light over the world"
      - "running back home through the forest, the nest visible in the distance, humming"
    pages: 10
